name: Build Node.js for iOS (arm64)

on:
  workflow_dispatch:

jobs:
  build-nodejs-ios:
    name: Build Node.js for iOS
    runs-on: macos-14

    steps:
      - name: Checkout Node.js Source
        uses: actions/checkout@v4
        with:
          repository: tempx-x/node
          submodules: true

      - name: Install Dependencies
        run: |
          brew install autoconf automake libtool python@3.10

      - name: Set Environment Variables
        run: |
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDKROOT=$SDKROOT"
          export CC="clang -arch arm64 -isysroot $SDKROOT"
          export CXX="clang++ -arch arm64 -isysroot $SDKROOT"
          export CPP="clang -E -arch arm64 -isysroot $SDKROOT"
          export LD="ld"
          export CFLAGS="-arch arm64 -isysroot $SDKROOT -miphoneos-version-min=12.0"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-arch arm64 -isysroot $SDKROOT -miphoneos-version-min=12.0"

      - name: Configure for iOS (arm64)
        run: |
          ./configure \
            --dest-cpu=arm64 \
            --dest-os=ios \
            --cross-compiling \
            --openssl-no-asm \
            --without-intl \
            -Dhost_os='macos'

      - name: Build Node.js
        run: |
          make -j$(sysctl -n hw.ncpu)

      - name: Check Built Binary
        run: |
          lipo -info out/Release/node
          file out/Release/node

      - name: Package Binary
        run: |
          mkdir -p node-ios-arm64
          cp out/Release/node node-ios-arm64/
          zip -r node-ios-arm64.zip node-ios-arm64/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-ios-arm64
          path: node-ios-arm64.zip
